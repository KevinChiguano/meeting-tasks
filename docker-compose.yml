version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: meeting-tasks-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-}
    # Nota: Si deseas configurar contraseña, crea la variable REDIS_PASSWORD en tu .env

volumes:
  redis_data:
    driver: local
